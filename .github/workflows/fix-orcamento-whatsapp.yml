name: Corrige orçamento WhatsApp
on:
  push:
    paths:
      - '.github/workflows/fix-orcamento-whatsapp.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir redirecionamento do orçamento
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "    window.open('https://wa.me/5564993191135?text='+encodeURIComponent(msg),'_blank','noopener');"
          new = "    const whatsappUrl='https://wa.me/5564993191135?text='+encodeURIComponent(msg);\n    window.location.href=whatsappUrl;"
          if old not in s:
              raise SystemExit('Trecho antigo não encontrado')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validar correção
        run: |
          grep -q "window.location.href=whatsappUrl" index.html
          grep -q "encodeURIComponent(msg)" index.html
      - name: Salvar correção e remover rotina temporária
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-orcamento-whatsapp.yml
          git commit -m "Corrige envio do orçamento para WhatsApp"
          git push
