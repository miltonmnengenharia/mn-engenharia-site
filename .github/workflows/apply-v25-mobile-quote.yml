name: Apply V25 Mobile Quote
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v25-mobile-quote.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplica melhorias V25
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('teste-v2.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('.services{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}', '.services{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}')
          s=s.replace('?v=21','?v=25')

          old_services='''    <div class="services">\n      <a class="service" href="projetos.html"><span class="n">01</span><h3>Projetos</h3><p>Arquitetura, estrutura, fundações, elétrica, hidrossanitário e compatibilização.</p></a>\n      <a class="service" href="construcao.html"><span class="n">02</span><h3>Construção</h3><p>Planejamento, execução organizada e acompanhamento técnico das principais etapas.</p></a>\n      <a class="service" href="gerenciamento-de-obras.html"><span class="n">03</span><h3>Gerenciamento</h3><p>Cronograma, materiais, equipes e controle operacional da obra.</p></a>\n      <a class="service" href="vistorias-tecnicas.html"><span class="n">04</span><h3>Vistorias</h3><p>Análise técnica para identificar problemas, riscos e orientar a melhor solução.</p></a>\n    </div>'''
          new_services='''    <div class="services">\n      <a class="service" href="projetos.html"><span class="n">01</span><h3>Projetos</h3><p>Arquitetura, estrutura, fundações, elétrica, hidrossanitário e compatibilização.</p></a>\n      <a class="service" href="construcao.html"><span class="n">02</span><h3>Construção</h3><p>Planejamento, execução organizada e acompanhamento técnico das principais etapas.</p></a>\n      <a class="service" href="acompanhamento-de-obras.html"><span class="n">03</span><h3>Acompanhamento</h3><p>Visitas técnicas avulsas ou periódicas para conferir etapas e orientar a execução.</p></a>\n      <a class="service" href="gerenciamento-de-obras.html"><span class="n">04</span><h3>Gerenciamento</h3><p>Cronograma, materiais, equipes e controle operacional da obra.</p></a>\n      <a class="service" href="vistorias-tecnicas.html"><span class="n">05</span><h3>Vistorias</h3><p>Análise técnica para identificar problemas, riscos e orientar a melhor solução.</p></a>\n    </div>'''
          if old_services in s:
              s=s.replace(old_services,new_services)

          s=s.replace('<div class="quote-badges"><span>Projetos</span><span>Construção</span><span>Gerenciamento</span><span>Vistorias</span></div>', '<div class="quote-badges"><span>Projetos</span><span>Construção</span><span>Acompanhamento</span><span>Gerenciamento</span><span>Vistorias</span></div>')

          new_form='''<form class="quote-form" id="quoteForm">\n      <div class="form-grid">\n        <div class="field"><label for="qNome">Nome</label><input id="qNome" required autocomplete="name" placeholder="Seu nome"></div>\n        <div class="field"><label for="qTelefone">Telefone / WhatsApp</label><input id="qTelefone" required inputmode="tel" autocomplete="tel" placeholder="(64) 9 9999-9999"></div>\n        <div class="field"><label for="qCidade">Cidade</label><input id="qCidade" required autocomplete="address-level2" placeholder="Ex.: Itumbiara - GO"></div>\n        <div class="field"><label for="qServico">Serviço</label><select id="qServico" required><option value="">Selecione</option><option>Projeto de engenharia</option><option>Construção</option><option>Acompanhamento de obra</option><option>Gerenciamento de obra</option><option>Vistoria técnica</option><option>Projeto + obra</option><option>Outro</option></select></div>\n        <div class="field"><label for="qTipo">Tipo de imóvel</label><select id="qTipo"><option>Residencial</option><option>Comercial</option><option>Reforma / ampliação</option><option>Outro</option></select></div>\n        <div class="field"><label for="qMetragem">Metragem aproximada</label><input id="qMetragem" inputmode="decimal" placeholder="Ex.: 180 m²"></div>\n        <div class="field"><label for="qPavimentos">Quantidade de pavimentos</label><select id="qPavimentos"><option>1 pavimento</option><option>2 pavimentos</option><option>3 ou mais pavimentos</option><option>Não se aplica / não sei</option></select></div>\n        <div class="field"><label for="qTerreno">Situação do terreno</label><select id="qTerreno"><option>Já tenho o terreno</option><option>Terreno em negociação</option><option>Ainda não tenho terreno</option><option>Não se aplica</option></select></div>\n        <div class="field"><label for="qProjeto">Projetos disponíveis</label><select id="qProjeto"><option>Ainda não tenho projeto</option><option>Tenho projeto arquitetônico</option><option>Tenho alguns projetos</option><option>Tenho os projetos completos</option><option>Não se aplica</option></select></div>\n        <div class="field"><label for="qFase">Fase atual</label><select id="qFase"><option>Estou começando / tenho uma ideia</option><option>Planejamento / orçamento</option><option>Projeto em desenvolvimento</option><option>Obra em andamento</option><option>Preciso avaliar um problema</option></select></div>\n        <div class="field"><label for="qPrazo">Quando pretende começar?</label><select id="qPrazo"><option>O quanto antes</option><option>Nos próximos 30 dias</option><option>Em 2 a 3 meses</option><option>Mais adiante</option><option>Ainda estou planejando</option></select></div>\n        <div class="field full"><label for="qDetalhes">O que você precisa?</label><textarea id="qDetalhes" placeholder="Conte resumidamente seu objetivo, a fase da obra e qualquer informação importante."></textarea></div>\n      </div>\n      <button class="btn btn-primary" type="submit">Montar pedido e abrir WhatsApp →</button>\n      <div class="form-note">A mensagem será organizada automaticamente. No WhatsApp você também poderá anexar fotos, plantas e outros arquivos antes de enviar.</div>\n    </form>'''
          s,n=re.subn(r'<form class="quote-form" id="quoteForm">.*?</form>',new_form,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('Não encontrou o formulário para substituir')

          new_script='''// ORCAMENTO-V25-SCRIPT\nconst quoteForm=document.getElementById('quoteForm');\nif(quoteForm){\n  const service=document.getElementById('qServico');\n  const details=document.getElementById('qDetalhes');\n  const requested=new URLSearchParams(window.location.search).get('servico');\n  if(requested&&service){\n    const opt=[...service.options].find(o=>o.text.toLowerCase()===requested.toLowerCase());\n    if(opt)service.value=opt.text;\n  }\n  const hints={\n    'Projeto de engenharia':'Ex.: quero projeto arquitetônico + estrutural para uma casa de 2 pavimentos.',\n    'Construção':'Ex.: quero construir do início ao fim e ainda estou definindo os projetos.',\n    'Acompanhamento de obra':'Ex.: obra em andamento; gostaria de visitas semanais para acompanhar a execução.',\n    'Gerenciamento de obra':'Ex.: preciso de cronograma, materiais, compras e acompanhamento das equipes.',\n    'Vistoria técnica':'Ex.: existe um vazamento/trinca/problema e gostaria de uma avaliação no local.',\n    'Projeto + obra':'Ex.: quero projeto completo e execução da residência.'\n  };\n  const updateHint=()=>{details.placeholder=hints[service.value]||'Conte resumidamente seu objetivo, a fase da obra e qualquer informação importante.'};\n  service.addEventListener('change',updateHint);updateHint();\n  quoteForm.addEventListener('submit',function(e){\n    e.preventDefault();\n    const v=id=>document.getElementById(id)?.value?.trim()||'Não informado';\n    const msg=[\n      'Olá, vim pelo site da MN Engenharia e gostaria de solicitar uma avaliação para orçamento.',\n      '',\n      '*DADOS DO CLIENTE*',\n      'Nome: '+v('qNome'),\n      'Telefone / WhatsApp: '+v('qTelefone'),\n      'Cidade: '+v('qCidade'),\n      '',\n      '*DADOS DO SERVIÇO*',\n      'Serviço: '+v('qServico'),\n      'Tipo de imóvel: '+v('qTipo'),\n      'Metragem aproximada: '+v('qMetragem'),\n      'Pavimentos: '+v('qPavimentos'),\n      'Terreno: '+v('qTerreno'),\n      'Projetos disponíveis: '+v('qProjeto'),\n      'Fase atual: '+v('qFase'),\n      'Previsão para começar: '+v('qPrazo'),\n      '',\n      '*DETALHES*',\n      v('qDetalhes'),\n      '',\n      'Posso enviar fotos ou plantas pelo WhatsApp, se necessário.'\n    ].join('\\n');\n    window.open('https://wa.me/5564993191135?text='+encodeURIComponent(msg),'_blank','noopener');\n  });\n}'''
          s,n=re.subn(r'// ORCAMENTO-V22-SCRIPT.*?</script>',new_script+'\n</script>',s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('Não encontrou o script de orçamento para substituir')

          mobile_css='''\n/* PREVIEW-V25-MOBILE */\n.mobile-bottom{display:none}\n@media(max-width:650px){\n  body{padding-bottom:76px}\n  .container{width:calc(100% - 24px)}\n  .previewbar{padding:6px 8px;letter-spacing:.07em}\n  .brand img{width:54px;height:54px}.brand span{font-size:15px}\n  .hero{padding:38px 0 42px}.hero-grid{gap:28px}h1{font-size:clamp(40px,12vw,54px);margin:16px 0}.lead{font-size:15px;line-height:1.65}.actions{gap:9px}.actions .btn{width:100%;min-height:54px}\n  .hero-visual{min-height:360px}.hero-photo{border-radius:22px}.float-card{padding:11px 12px;max-width:180px;border-radius:14px}.float-card strong{font-size:12px}.float-card span{font-size:9px}.fc1{left:8px;top:10px}.fc2{right:8px;bottom:10px}\n  .section{padding:60px 0}.section-head{gap:12px;margin-bottom:24px}.section-head p{font-size:13px}.section h2,.section-head h2{font-size:34px}\n  .services,.portfolio,.trust-grid,.process,.benefits,.insta-gallery{grid-template-columns:1fr}\n  .service{min-height:auto;padding:22px}.service h3{margin-top:22px}.project-body{padding:20px}.brand-stage{min-height:280px}.quote-intro,.quote-form{padding:21px;border-radius:20px}.quote-intro{position:relative;top:auto}.field input,.field select,.field textarea{font-size:16px;min-height:50px}.field textarea{min-height:130px}.quote-form .btn{min-height:58px;font-size:13px}.faq{gap:24px}.cta-box{padding:28px 22px}.footer-grid{padding-bottom:10px}\n  .social-float{display:none}\n  .modal{padding:4px}.modal img{width:99vw;max-width:99vw;max-height:86vh;border-radius:10px}.modal button{top:8px;right:8px}\n  .mobile-bottom{position:fixed;display:grid;grid-template-columns:.9fr 1.1fr;gap:8px;left:8px;right:8px;bottom:8px;z-index:180;padding:8px;border:1px solid rgba(216,184,108,.28);border-radius:18px;background:rgba(2,7,17,.94);backdrop-filter:blur(16px);box-shadow:0 14px 38px rgba(0,0,0,.45)}\n  .mobile-bottom a{min-height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;font-weight:950;padding:0 9px}\n  .mobile-bottom .mb-quote{background:linear-gradient(135deg,var(--gold2),#b58b3f);color:#07111f}.mobile-bottom .mb-wa{border:1px solid rgba(37,211,102,.45);background:#123c2a;color:#eafff1}\n}\n'''
          if 'PREVIEW-V25-MOBILE' not in s:
              s=s.replace('</style>',mobile_css+'</style>',1)

          mobile_html='''\n<div class="mobile-bottom" aria-label="Atalhos de contato">\n  <a class="mb-wa" href="https://wa.me/5564993191135?text=Olá%2C%20vim%20pelo%20site%20da%20MN%20Engenharia%20e%20gostaria%20de%20falar%20sobre%20um%20serviço." target="_blank" rel="noopener">WhatsApp</a>\n  <a class="mb-quote" href="#orcamento-rapido">Orçamento rápido</a>\n</div>\n'''
          if 'class="mobile-bottom"' not in s:
              s=s.replace('</body>',mobile_html+'\n</body>')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Salva atualização
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add teste-v2.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Melhora mobile, orçamento e acompanhamento na prévia'
          git push origin main
