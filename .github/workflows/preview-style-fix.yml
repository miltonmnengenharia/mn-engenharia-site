name: Preview style fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/preview-style-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply preview CSS and cache bust
        run: |
          python3 -c "from pathlib import Path; p=Path('teste-v2.html'); s=p.read_text(); s=s.replace('/assets/hero-premium.webp','/assets/hero-premium.webp?v=21').replace('/assets/projeto-conceitos-fachadas.webp','/assets/projeto-conceitos-fachadas.webp?v=21').replace('/assets/projeto-arquitetura-integrada.webp','/assets/projeto-arquitetura-integrada.webp?v=21').replace('/assets/projeto-casas-urbanas.webp','/assets/projeto-casas-urbanas.webp?v=21'); css='''\n/* PREVIEW-V21 */\n.nav{min-height:96px}.brand{gap:15px;color:#fff}.brand img{width:76px;height:76px;object-fit:contain;padding:3px;border-radius:50%;border:1px solid rgba(245,221,161,.24);box-shadow:0 10px 30px rgba(0,0,0,.34),0 0 28px rgba(216,184,108,.12)}.brand span{font-size:19px;font-weight:950;white-space:nowrap}.hero-visual{min-height:620px}.hero-photo{inset:0 0 0 20px;border-color:rgba(245,221,161,.30);box-shadow:0 34px 90px rgba(0,0,0,.42)}.hero-photo img{width:100%;height:100%;object-fit:cover;object-position:center;filter:contrast(1.04) saturate(1.04)}.hero-photo:after{background:linear-gradient(180deg,rgba(2,7,17,0) 50%,rgba(2,7,17,.46))}.project-image{background:#fff}.project-image img{object-fit:contain;object-position:center;background:#fff}.project-card:hover .project-image img{transform:scale(1.01)}.modal{padding:14px;background:rgba(0,0,0,.95);backdrop-filter:blur(5px)}.modal img{display:block;width:min(1600px,96vw);height:auto;max-width:96vw;max-height:92vh;object-fit:contain;border-radius:16px;background:#fff;border:1px solid rgba(245,221,161,.22);box-shadow:0 34px 100px rgba(0,0,0,.68)}.modal button{z-index:3;top:16px;right:20px;width:52px;height:52px;background:rgba(4,14,27,.92);border-color:rgba(245,221,161,.35);font-size:28px}.brand-stage img{width:min(72%,360px)}@media(max-width:980px){.nav{min-height:86px}.navlinks{top:86px}.brand img{width:64px;height:64px}.brand span{font-size:17px}.hero-photo{left:0}.hero-visual{min-height:540px}.modal img{width:96vw;max-height:90vh}}@media(max-width:650px){.nav{min-height:78px}.navlinks{top:78px}.brand{gap:10px}.brand img{width:56px;height:56px}.brand span{font-size:15px}.hero-visual{min-height:440px}.hero-photo{inset:0}.modal{padding:6px}.modal img{width:98vw;max-width:98vw;max-height:88vh}.modal button{top:9px;right:9px;width:46px;height:46px}}\n'''; s=s.replace('</style>',css+'</style>',1) if 'PREVIEW-V21' not in s else s; p.write_text(s)"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teste-v2.html
          git commit -m "Melhora logo, hero e zoom dos projetos" || exit 0
          git push origin main
