name: Link Projetos Detalhados V23
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/link-projetos-detalhados-v23.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Adiciona links nos cards
        shell: bash
        run: python -c "import base64;exec(base64.b64decode('').decode())"
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add teste-v2.html
          git diff --cached --quiet && exit 0
          git commit -m 'Adiciona links das páginas individuais no portfólio'
          git push origin main
