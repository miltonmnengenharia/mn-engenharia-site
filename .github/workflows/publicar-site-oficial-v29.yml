name: Publicar site oficial V29

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-site-oficial-v29.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Transformar V29 em site oficial
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          homepage = Path('teste-v2.html').read_text(encoding='utf-8')
          Path('index.html').write_text(homepage, encoding='utf-8')

          production_pages = [
              'index.html','sobre.html','projetos.html','construcao.html',
              'acompanhamento-de-obras.html','gerenciamento-de-obras.html',
              'vistorias-tecnicas.html','contato.html',
              'projeto-conceitos-fachadas.html','projeto-residencial-integrado.html',
              'projeto-casas-urbanas.html'
          ]

          canonical = {
              'index.html':'https://mnengenharia.com.br/',
              'sobre.html':'https://mnengenharia.com.br/sobre.html',
              'projetos.html':'https://mnengenharia.com.br/projetos.html',
              'construcao.html':'https://mnengenharia.com.br/construcao.html',
              'acompanhamento-de-obras.html':'https://mnengenharia.com.br/acompanhamento-de-obras.html',
              'gerenciamento-de-obras.html':'https://mnengenharia.com.br/gerenciamento-de-obras.html',
              'vistorias-tecnicas.html':'https://mnengenharia.com.br/vistorias-tecnicas.html',
              'contato.html':'https://mnengenharia.com.br/contato.html',
              'projeto-conceitos-fachadas.html':'https://mnengenharia.com.br/projeto-conceitos-fachadas.html',
              'projeto-residencial-integrado.html':'https://mnengenharia.com.br/projeto-residencial-integrado.html',
              'projeto-casas-urbanas.html':'https://mnengenharia.com.br/projeto-casas-urbanas.html',
          }

          for name in production_pages:
              p = Path(name)
              if not p.exists():
                  raise SystemExit(f'Arquivo obrigatório ausente: {name}')
              s = p.read_text(encoding='utf-8')

              # Remove barras e avisos de prévia/teste.
              s = re.sub(r'<div class="previewbar">.*?</div>\s*', '', s, flags=re.S)
              s = re.sub(r'<div class="preview">.*?</div>\s*', '', s, flags=re.S)
              s = s.replace('Prévia do novo site • conteúdo em revisão antes da publicação oficial', 'Site oficial da MN Engenharia')
              s = re.sub(r'Prévia V\d+\s*•\s*conteúdo em revisão antes da publicação oficial', 'Site oficial da MN Engenharia', s)
              s = s.replace('Página de serviço • versão de teste', '')
              s = s.replace('Página de projeto • versão de teste', '')

              # Navegação oficial.
              s = re.sub(r'teste-v2\.html(?:\?v=\d+)?', 'index.html', s)
              s = re.sub(r'([A-Za-z0-9_-]+\.html)\?v=\d+', r'\1', s)

              # Indexação oficial.
              if re.search(r'<meta name="robots"[^>]*>', s):
                  s = re.sub(r'<meta name="robots"[^>]*>', '<meta name="robots" content="index,follow,max-image-preview:large">', s, count=1)
              else:
                  s = s.replace('</head>', '<meta name="robots" content="index,follow,max-image-preview:large">\n</head>', 1)

              # Canonical correto por página.
              c = canonical[name]
              if re.search(r'<link rel="canonical"[^>]*>', s):
                  s = re.sub(r'<link rel="canonical"[^>]*>', f'<link rel="canonical" href="{c}">', s, count=1)
              else:
                  s = s.replace('</head>', f'<link rel="canonical" href="{c}">\n</head>', 1)

              p.write_text(s, encoding='utf-8')

          # Mantém a antiga prévia fora do Google.
          preview = Path('teste-v2.html')
          ps = preview.read_text(encoding='utf-8')
          if re.search(r'<meta name="robots"[^>]*>', ps):
              ps = re.sub(r'<meta name="robots"[^>]*>', '<meta name="robots" content="noindex,nofollow">', ps, count=1)
          preview.write_text(ps, encoding='utf-8')

          # Componente compartilhado passa a apontar para a home oficial.
          js = Path('assets/site-v27.js')
          if js.exists():
              s = js.read_text(encoding='utf-8')
              s = s.replace("||'teste-v2.html'", "||'index.html'")
              s = s.replace("const home='teste-v2.html'", "const home='index.html'")
              s = s.replace('Prévia do novo site • conteúdo em revisão antes da publicação oficial', 'Projetos • Obras • Engenharia')
              js.write_text(s, encoding='utf-8')

          # Sitemap oficial completo.
          urls = [
              ('https://mnengenharia.com.br/','1.0'),
              ('https://mnengenharia.com.br/sobre.html','0.8'),
              ('https://mnengenharia.com.br/projetos.html','0.9'),
              ('https://mnengenharia.com.br/construcao.html','0.9'),
              ('https://mnengenharia.com.br/acompanhamento-de-obras.html','0.9'),
              ('https://mnengenharia.com.br/gerenciamento-de-obras.html','0.9'),
              ('https://mnengenharia.com.br/vistorias-tecnicas.html','0.9'),
              ('https://mnengenharia.com.br/contato.html','0.8'),
              ('https://mnengenharia.com.br/projeto-conceitos-fachadas.html','0.7'),
              ('https://mnengenharia.com.br/projeto-residencial-integrado.html','0.7'),
              ('https://mnengenharia.com.br/projeto-casas-urbanas.html','0.7'),
          ]
          sitemap = ['<?xml version="1.0" encoding="UTF-8"?>','<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for url, priority in urls:
              sitemap.append(f'  <url><loc>{url}</loc><lastmod>2026-09-15</lastmod><changefreq>monthly</changefreq><priority>{priority}</priority></url>')
          sitemap.append('</urlset>')
          Path('sitemap.xml').write_text('\n'.join(sitemap)+'\n', encoding='utf-8')
          Path('robots.txt').write_text('User-agent: *\nAllow: /\n\nSitemap: https://mnengenharia.com.br/sitemap.xml\n', encoding='utf-8')

          # Validações mínimas antes de publicar.
          official = Path('index.html').read_text(encoding='utf-8')
          checks = {
              'index liberado para Google': 'index,follow' in official,
              'sem barra de prévia': 'class="previewbar"' not in official,
              'WhatsApp presente': 'wa.me/5564993191135' in official,
              'logo presente': 'assets/logo.webp' in official,
              'home oficial': 'https://mnengenharia.com.br/' in official,
          }
          for label, ok in checks.items():
              if not ok:
                  raise SystemExit(f'Falha na validação: {label}')
          print('Site oficial V29 validado com sucesso.')
          PY

      - name: Limpar rotina temporária e registrar publicação
        shell: bash
        run: |
          rm -f .github/workflows/publicar-site-oficial-v29.yml
          cat > SITE_OFICIAL.md <<'EOF'
          # Site oficial — MN Engenharia

          Versão publicada: V29
          Data: 15/09/2026
          Home oficial: https://mnengenharia.com.br/
          Snapshot de segurança: branch `versao-definitiva-v29`

          Esta versão substitui o antigo `index.html` pela interface V29 aprovada.
          EOF

      - name: Commit do site oficial
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publica V29 como site oficial' || exit 0
          git push origin main
