name: SEO V30

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-v30.yml'

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar SEO V30
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json

          BASE='https://mnengenharia.com.br'
          pages={
            'index.html':('Engenharia em Itumbiara | Projetos e Obras | MN Engenharia','MN Engenharia em Itumbiara - GO: projetos, construção, acompanhamento e gerenciamento de obras e vistorias técnicas para residências e empreendimentos.',BASE+'/',None,'assets/hero-premium.webp'),
            'sobre.html':('MN Engenharia em Itumbiara - GO | Sobre a Empresa','Conheça a MN Engenharia, empresa de engenharia civil em Itumbiara - GO, com atuação em projetos, obras, acompanhamento, gerenciamento e vistorias técnicas.',BASE+'/sobre.html',None,'assets/logo.webp'),
            'projetos.html':('Projetos de Engenharia em Itumbiara - GO | MN Engenharia','Projetos de engenharia em Itumbiara - GO: arquitetônico, estrutural, fundações, instalações e compatibilização para residências e empreendimentos.',BASE+'/projetos.html','Projetos de engenharia','assets/projeto-arquitetura-integrada.webp'),
            'construcao.html':('Construção e Obras em Itumbiara - GO | MN Engenharia','Construção e execução de obras em Itumbiara - GO com planejamento, organização das etapas, acompanhamento técnico e gestão pela MN Engenharia.',BASE+'/construcao.html','Construção e execução de obras','assets/hero-premium.webp'),
            'acompanhamento-de-obras.html':('Acompanhamento de Obras em Itumbiara - GO | MN Engenharia','Acompanhamento de obras em Itumbiara - GO com visitas técnicas, conferência da execução, orientação e controle das etapas conforme o projeto.',BASE+'/acompanhamento-de-obras.html','Acompanhamento técnico de obras','assets/acompanhamento.webp'),
            'gerenciamento-de-obras.html':('Gerenciamento de Obras em Itumbiara - GO | MN Engenharia','Gerenciamento de obras em Itumbiara - GO com cronograma, materiais, cotações, organização das etapas e coordenação operacional da execução.',BASE+'/gerenciamento-de-obras.html','Gerenciamento de obras','assets/gestao.webp'),
            'vistorias-tecnicas.html':('Vistorias Técnicas em Itumbiara - GO | MN Engenharia','Vistorias técnicas em Itumbiara - GO para imóveis e obras, com análise das condições observadas, registros e orientação técnica conforme a contratação.',BASE+'/vistorias-tecnicas.html','Vistorias técnicas de imóveis e obras','assets/logo.webp'),
            'contato.html':('Orçamento de Engenharia em Itumbiara - GO | MN Engenharia','Solicite orçamento de engenharia em Itumbiara - GO para projetos, construção, acompanhamento, gerenciamento de obras e vistorias técnicas.',BASE+'/contato.html',None,'assets/logo.webp'),
            'projeto-conceitos-fachadas.html':('Conceitos de Fachadas | Portfólio MN Engenharia','Estudo conceitual de fachadas residenciais do portfólio da MN Engenharia, com soluções de arquitetura e apresentação visual para projetos residenciais.',BASE+'/projeto-conceitos-fachadas.html',None,'assets/projeto-conceitos-fachadas.webp'),
            'projeto-residencial-integrado.html':('Projeto Residencial Integrado | Portfólio MN Engenharia','Estudo de projeto residencial integrado apresentado no portfólio da MN Engenharia, reunindo arquitetura, organização espacial e soluções para execução.',BASE+'/projeto-residencial-integrado.html',None,'assets/projeto-arquitetura-integrada.webp'),
            'projeto-casas-urbanas.html':('Casas Urbanas | Portfólio MN Engenharia','Estudo conceitual de casas urbanas do portfólio da MN Engenharia, com fachadas residenciais e soluções visuais para projetos em lotes urbanos.',BASE+'/projeto-casas-urbanas.html',None,'assets/projeto-casas-urbanas.webp'),
          }

          org={
            '@type':'ProfessionalService','@id':BASE+'/#organization','name':'MN Engenharia','legalName':'MN Engenharia Civil LTDA','url':BASE+'/',
            'logo':{'@type':'ImageObject','url':BASE+'/assets/logo.webp'},'image':BASE+'/assets/hero-premium.webp','telephone':'+55 64 99319-1135','email':'milton@mnengenharia.com.br',
            'address':{'@type':'PostalAddress','addressLocality':'Itumbiara','addressRegion':'GO','addressCountry':'BR'},
            'areaServed':[{'@type':'City','name':'Itumbiara','addressRegion':'GO','addressCountry':'BR'},{'@type':'State','name':'Goiás','addressCountry':'BR'}],
            'sameAs':['https://www.instagram.com/mn_engenhariacivil']
          }
          website={'@type':'WebSite','@id':BASE+'/#website','url':BASE+'/','name':'MN Engenharia','alternateName':'MN Engenharia Civil','inLanguage':'pt-BR','publisher':{'@id':BASE+'/#organization'}}

          def replace(text,pat,val,after):
            if re.search(pat,text,re.I|re.S): return re.sub(pat,val,text,count=1,flags=re.I|re.S)
            m=re.search(after,text,re.I|re.S)
            if not m: raise RuntimeError('Ponto de inserção não encontrado')
            return text[:m.end()]+'\n'+val+text[m.end():]

          for fn,(title,desc,url,service,img) in pages.items():
            p=Path(fn); t=p.read_text(encoding='utf-8')
            t=re.sub(r'\s*<!-- SEO-V30-START -->.*?<!-- SEO-V30-END -->\s*','\n',t,flags=re.I|re.S)
            t=re.sub(r'\s*<script[^>]+type=["\']application/ld\+json["\'][^>]*>.*?</script>\s*','\n',t,flags=re.I|re.S)
            t=re.sub(r'<title>.*?</title>',f'<title>{title}</title>',t,count=1,flags=re.I|re.S)
            t=replace(t,r'<meta\s+name=["\']description["\'][^>]*>',f'<meta name="description" content="{desc}">',r'</title>')
            t=replace(t,r'<meta\s+name=["\']robots["\'][^>]*>','<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">',r'<meta\s+name=["\']description["\'][^>]*>')
            t=replace(t,r'<link\s+rel=["\']canonical["\'][^>]*>',f'<link rel="canonical" href="{url}">',r'<meta\s+name=["\']robots["\'][^>]*>')
            for pat in [r'<meta\s+property=["\']og:(?:title|description|type|image|url|locale|site_name)["\'][^>]*>\s*',r'<meta\s+name=["\']twitter:(?:card|title|description|image)["\'][^>]*>\s*',r'<meta\s+name=["\'](?:theme-color|author|geo\.region|geo\.placename)["\'][^>]*>\s*',r'<link\s+rel=["\']alternate["\'][^>]*hreflang=["\'](?:pt-BR|x-default)["\'][^>]*>\s*']:
              t=re.sub(pat,'',t,flags=re.I)
            image=img if img.startswith('http') else BASE+'/'+img
            graph=[dict(org),dict(website)]
            page={'@type':'WebPage','@id':url+'#webpage','url':url,'name':title,'description':desc,'inLanguage':'pt-BR','isPartOf':{'@id':BASE+'/#website'},'about':{'@id':BASE+'/#organization'}}
            if service:
              graph.append({'@type':'Service','@id':url+'#service','name':service,'serviceType':service,'url':url,'description':desc,'provider':{'@id':BASE+'/#organization'},'areaServed':{'@type':'City','name':'Itumbiara','addressRegion':'GO','addressCountry':'BR'}})
              page['mainEntity']={'@id':url+'#service'}
            graph.append(page)
            if fn!='index.html':
              graph.append({'@type':'BreadcrumbList','@id':url+'#breadcrumb','itemListElement':[{'@type':'ListItem','position':1,'name':'Início','item':BASE+'/'},{'@type':'ListItem','position':2,'name':title.split('|')[0].strip(),'item':url}]})
            schema=json.dumps({'@context':'https://schema.org','@graph':graph},ensure_ascii=False,separators=(',',':'))
            block='\n'.join(['<!-- SEO-V30-START -->','<meta name="theme-color" content="#020711">','<meta name="author" content="MN Engenharia Civil LTDA">','<meta name="geo.region" content="BR-GO">','<meta name="geo.placename" content="Itumbiara">',f'<link rel="alternate" hreflang="pt-BR" href="{url}">',f'<link rel="alternate" hreflang="x-default" href="{url}">','<meta property="og:locale" content="pt_BR">','<meta property="og:site_name" content="MN Engenharia">','<meta property="og:type" content="website">',f'<meta property="og:title" content="{title}">',f'<meta property="og:description" content="{desc}">',f'<meta property="og:url" content="{url}">',f'<meta property="og:image" content="{image}">','<meta name="twitter:card" content="summary_large_image">',f'<meta name="twitter:title" content="{title}">',f'<meta name="twitter:description" content="{desc}">',f'<meta name="twitter:image" content="{image}">',f'<script type="application/ld+json">{schema}</script>','<!-- SEO-V30-END -->'])
            t=re.sub(r'</head>',block+'\n</head>',t,count=1,flags=re.I)
            p.write_text(t,encoding='utf-8')

          p=Path('teste-v2.html'); t=p.read_text(encoding='utf-8')
          t=re.sub(r'<meta\s+name=["\']robots["\'][^>]*>','<meta name="robots" content="noindex,follow,max-image-preview:large">',t,count=1,flags=re.I)
          p.write_text(t,encoding='utf-8')

          Path('robots.txt').write_text('User-agent: *\nAllow: /\nDisallow: /MN_Engenharia_GitHub_Pages_PRONTO/\nDisallow: /scripts/\nDisallow: /SITE_OFICIAL.md\nDisallow: /VERSAO_DEFINITIVA.md\nDisallow: /preview-v21-refresh.txt\n\nSitemap: https://mnengenharia.com.br/sitemap.xml\n',encoding='utf-8')
          Path('SITE_OFICIAL.md').write_text('# Site oficial — MN Engenharia\n\nVersão publicada: V30 SEO\nBase visual: V29\nData: 15/09/2026\nHome oficial: https://mnengenharia.com.br/\nSnapshot de segurança: branch `versao-definitiva-v29`\n\nA V30 preserva o visual da V29 e adiciona otimizações técnicas de SEO para Google.\n',encoding='utf-8')

          for fn in pages:
            t=Path(fn).read_text(encoding='utf-8')
            assert 'SEO-V30-START' in t and 'ProfessionalService' in t and 'WebSite' in t and 'index,follow' in t, fn
          assert 'noindex,follow' in Path('teste-v2.html').read_text(encoding='utf-8').lower()
          print('SEO V30 OK')
          PY
      - name: Salvar alterações
        run: |
          rm .github/workflows/seo-v30.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Otimiza SEO local e dados estruturados V30"
          git push
