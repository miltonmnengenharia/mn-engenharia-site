name: Site audit fixes V28

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-audit-fixes-v28.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply fixes
        run: python3 -c "import base64;exec(base64.b64decode('').decode())"
      - name: Cleanup old workflows
        run: rm -f .github/workflows/link-projeto-conceitos.yml .github/workflows/link-projetos-detalhados-v23.yml .github/workflows/portfolio-quote-v22.yml .github/workflows/preview-portfolio-orcamento-v2.yml .github/workflows/preview-portfolio-orcamento.yml .github/workflows/preview-style-fix.yml .github/workflows/site-audit-fixes-v28.yml
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Corrige navegacao, formularios e limpa automacoes antigas'
          git push origin main
