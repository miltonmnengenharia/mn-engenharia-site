name: Preview Portfolio Orcamento V2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preview-portfolio-orcamento-v2.yml'
permissions:
  contents: write
jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch preview
        run: python -c "import base64;exec(base64.b64decode('...') ).decode())" 
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add teste-v2.html
          git diff --cached --quiet && exit 0
          git commit -m 'Melhora portfólio e adiciona orçamento rápido'
          git push origin main
