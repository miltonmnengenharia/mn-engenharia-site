name: WhatsApp premium V29

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/whatsapp-premium-v29.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Melhorar WhatsApp no site
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('teste-v2.html')
          s = p.read_text(encoding='utf-8')

          old_css = ".social-float{position:fixed;right:18px;bottom:18px;z-index:120;display:flex;flex-direction:column;gap:11px}.social-float a{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;box-shadow:0 14px 34px rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.18);transition:.2s}.social-float a:hover{transform:translateY(-3px) scale(1.03)}.social-float svg{width:25px;height:25px;fill:#fff}.ig{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045)}.wa{background:linear-gradient(135deg,#25d366,#1ca94c)}"
          new_css = ".social-float{position:fixed;right:18px;bottom:18px;z-index:120;display:flex;flex-direction:column;align-items:center;gap:12px}.social-float a{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;box-shadow:0 14px 34px rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.18);transition:transform .22s ease,box-shadow .22s ease,filter .22s ease}.social-float a:hover{transform:translateY(-4px) scale(1.045)}.social-float svg{width:25px;height:25px;fill:#fff}.ig{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045)}.social-float .wa{position:relative;width:62px;height:62px;background:radial-gradient(circle at 32% 24%,#59ef86 0,#25d366 42%,#16a94d 100%);border:2px solid rgba(255,255,255,.86);box-shadow:0 16px 38px rgba(0,0,0,.38),0 0 0 5px rgba(37,211,102,.10),0 0 28px rgba(37,211,102,.24),inset 0 1px 0 rgba(255,255,255,.42)}.social-float .wa:before{content:\"\";position:absolute;inset:5px;border-radius:50%;background:linear-gradient(145deg,rgba(255,255,255,.20),transparent 42%);pointer-events:none}.social-float .wa svg{position:relative;z-index:1;width:33px;height:33px;fill:#fff;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}.social-float .wa:hover{box-shadow:0 20px 44px rgba(0,0,0,.42),0 0 0 6px rgba(37,211,102,.13),0 0 34px rgba(37,211,102,.32);filter:saturate(1.06)}"
          if old_css not in s:
              raise SystemExit('Bloco CSS social-float nao encontrado')
          s = s.replace(old_css, new_css, 1)

          old_wa = '<a class="wa" href="https://wa.me/5564993191135?text=Olá%2C%20vim%20pelo%20site%20da%20MN%20Engenharia%20e%20gostaria%20de%20solicitar%20um%20orçamento." target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 24 24"><path d="M20 3.9A10 10 0 0 0 4.4 16.1L3 21l5-1.3A10 10 0 1 0 20 3.9zM12 20a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 20zm4.4-6c-.2-.1-1.4-.7-1.6-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.6 6.6 0 0 1-3.3-2.9c-.2-.3 0-.5.1-.6l.4-.5a1.8 1.8 0 0 0 .2-.5.6.6 0 0 0 0-.5c-.1-.1-.6-1.3-.8-1.8-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3A2.9 2.9 0 0 0 7 9.7a5 5 0 0 0 1.1 2.7 11.2 11.2 0 0 0 4.3 3.8 14 14 0 0 0 1.5.6 3.6 3.6 0 0 0 1.7.1 2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg></a>'
          new_wa = '<a class="wa" href="https://wa.me/5564993191135?text=Olá%2C%20vim%20pelo%20site%20da%20MN%20Engenharia%20e%20gostaria%20de%20solicitar%20um%20orçamento." target="_blank" rel="noopener" aria-label="Falar com a MN Engenharia no WhatsApp" title="Falar no WhatsApp"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16.03 3.2A12.55 12.55 0 0 0 5.3 22.25L3.5 28.8l6.7-1.75A12.55 12.55 0 1 0 16.03 3.2Zm0 22.83c-1.78 0-3.52-.46-5.05-1.34l-.36-.21-3.98 1.04 1.06-3.87-.24-.4a10.25 10.25 0 1 1 8.57 4.78Zm5.62-7.68c-.31-.16-1.83-.9-2.11-1-.28-.1-.49-.16-.7.16-.2.3-.8 1-.98 1.2-.18.2-.36.23-.67.08-.3-.16-1.3-.48-2.47-1.53a9.2 9.2 0 0 1-1.71-2.12c-.18-.31-.02-.48.14-.63.14-.14.31-.36.46-.54.16-.18.2-.31.31-.52.1-.2.05-.39-.03-.54-.08-.16-.7-1.68-.95-2.3-.25-.6-.51-.52-.7-.53h-.6c-.2 0-.54.08-.82.39-.28.31-1.08 1.05-1.08 2.57s1.1 2.99 1.26 3.2c.15.2 2.17 3.31 5.26 4.64.73.32 1.31.51 1.76.65.74.23 1.41.2 1.94.12.59-.09 1.83-.75 2.09-1.47.26-.72.26-1.34.18-1.47-.07-.13-.28-.2-.59-.36Z"/></svg></a>'
          if old_wa not in s:
              raise SystemExit('Botao WhatsApp desktop nao encontrado')
          s = s.replace(old_wa, new_wa, 1)

          old_mobile_css = ".mobile-bottom .mb-quote{background:linear-gradient(135deg,var(--gold2),#b58b3f);color:#07111f}.mobile-bottom .mb-wa{border:1px solid rgba(37,211,102,.45);background:#123c2a;color:#eafff1}"
          new_mobile_css = ".mobile-bottom .mb-quote{background:linear-gradient(135deg,var(--gold2),#b58b3f);color:#07111f}.mobile-bottom .mb-wa{gap:8px;border:1px solid rgba(255,255,255,.22);background:linear-gradient(135deg,#2ed968,#159e49);color:#fff;box-shadow:0 8px 22px rgba(37,211,102,.18)}.mobile-bottom .mb-wa svg{width:21px;height:21px;fill:#fff;flex:0 0 auto}"
          if old_mobile_css not in s:
              raise SystemExit('CSS do WhatsApp mobile nao encontrado')
          s = s.replace(old_mobile_css, new_mobile_css, 1)

          old_mobile = '<a class="mb-wa" href="https://wa.me/5564993191135?text=Olá%2C%20vim%20pelo%20site%20da%20MN%20Engenharia%20e%20gostaria%20de%20falar%20sobre%20um%20serviço." target="_blank" rel="noopener">WhatsApp</a>'
          new_mobile = '<a class="mb-wa" href="https://wa.me/5564993191135?text=Olá%2C%20vim%20pelo%20site%20da%20MN%20Engenharia%20e%20gostaria%20de%20falar%20sobre%20um%20serviço." target="_blank" rel="noopener" aria-label="Falar no WhatsApp"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16.03 3.2A12.55 12.55 0 0 0 5.3 22.25L3.5 28.8l6.7-1.75A12.55 12.55 0 1 0 16.03 3.2Zm0 22.83c-1.78 0-3.52-.46-5.05-1.34l-.36-.21-3.98 1.04 1.06-3.87-.24-.4a10.25 10.25 0 1 1 8.57 4.78Zm5.62-7.68c-.31-.16-1.83-.9-2.11-1-.28-.1-.49-.16-.7.16-.2.3-.8 1-.98 1.2-.18.2-.36.23-.67.08-.3-.16-1.3-.48-2.47-1.53a9.2 9.2 0 0 1-1.71-2.12c-.18-.31-.02-.48.14-.63.14-.14.31-.36.46-.54.16-.18.2-.31.31-.52.1-.2.05-.39-.03-.54-.08-.16-.7-1.68-.95-2.3-.25-.6-.51-.52-.7-.53h-.6c-.2 0-.54.08-.82.39-.28.31-1.08 1.05-1.08 2.57s1.1 2.99 1.26 3.2c.15.2 2.17 3.31 5.26 4.64.73.32 1.31.51 1.76.65.74.23 1.41.2 1.94.12.59-.09 1.83-.75 2.09-1.47.26-.72.26-1.34.18-1.47-.07-.13-.28-.2-.59-.36Z"/></svg><span>WhatsApp</span></a>'
          if old_mobile not in s:
              raise SystemExit('Botao WhatsApp mobile nao encontrado')
          s = s.replace(old_mobile, new_mobile, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Remover workflow temporario
        run: rm -f .github/workflows/whatsapp-premium-v29.yml

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Melhora botão do WhatsApp no desktop e celular'
          git push origin main
