name: Portfolio and quote V22

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/portfolio-quote-v22.yml'

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply portfolio and quote improvements
        run: |
          echo ' ' | base64 -d | python3
      - name: Commit preview changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teste-v2.html
          git commit -m "Melhora portfólio e adiciona orçamento rápido" || exit 0
          git push origin main
