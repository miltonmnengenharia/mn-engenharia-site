name: Corrige orçamento WhatsApp V2
on:
  push:
    paths:
      - '.github/workflows/fix-orcamento-whatsapp-v2.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar correção robusta
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_form = '<form class="quote-form" id="quoteForm">'
          new_form = '<form class="quote-form" id="quoteForm" onsubmit="event.preventDefault(); enviarOrcamentoWhatsApp(); return false;">'
          if old_form in s:
              s = s.replace(old_form, new_form, 1)

          old_button = '<button class="btn btn-primary" type="submit">Montar pedido e abrir WhatsApp →</button>'
          new_button = '<button class="btn btn-primary" type="button" id="quoteSubmitButton" onclick="enviarOrcamentoWhatsApp()">Montar pedido e abrir WhatsApp →</button>'
          if old_button in s:
              s = s.replace(old_button, new_button, 1)

          marker = '<!-- WHATSAPP-QUOTE-V2 -->'
          if marker not in s:
              script = '''\n<!-- WHATSAPP-QUOTE-V2 -->\n<script>\nfunction enviarOrcamentoWhatsApp(){\n  var form=document.getElementById('quoteForm');\n  if(!form){return false;}\n  if(typeof form.reportValidity==='function' && !form.reportValidity()){return false;}\n  function v(id){\n    var el=document.getElementById(id);\n    if(!el){return 'Não informado';}\n    var value=(el.value||'').trim();\n    return value||'Não informado';\n  }\n  var msg=[\n    'Olá, vim pelo site da MN Engenharia e gostaria de solicitar uma avaliação para orçamento.',\n    '',\n    '*DADOS DO CLIENTE*',\n    'Nome: '+v('qNome'),\n    'Telefone / WhatsApp: '+v('qTelefone'),\n    'Cidade: '+v('qCidade'),\n    '',\n    '*DADOS DO SERVIÇO*',\n    'Serviço: '+v('qServico'),\n    'Tipo de imóvel: '+v('qTipo'),\n    'Metragem aproximada: '+v('qMetragem'),\n    'Pavimentos: '+v('qPavimentos'),\n    'Terreno: '+v('qTerreno'),\n    'Projetos disponíveis: '+v('qProjeto'),\n    'Fase atual: '+v('qFase'),\n    'Previsão para começar: '+v('qPrazo'),\n    '',\n    '*DETALHES*',\n    v('qDetalhes'),\n    '',\n    'Posso enviar fotos ou plantas pelo WhatsApp, se necessário.'\n  ].join('\\n');\n  var whatsappUrl='https://api.whatsapp.com/send?phone=5564993191135&text='+encodeURIComponent(msg);\n  window.location.assign(whatsappUrl);\n  return false;\n}\n</script>\n'''
              s = s.replace('</head>', script + '\n</head>', 1)

          p.write_text(s, encoding='utf-8')

          assert 'type="button" id="quoteSubmitButton" onclick="enviarOrcamentoWhatsApp()"' in s
          assert 'onsubmit="event.preventDefault(); enviarOrcamentoWhatsApp(); return false;"' in s
          assert 'https://api.whatsapp.com/send?phone=5564993191135&text=' in s
          assert marker in s
      - name: Remover workflow temporário
        run: rm -f .github/workflows/fix-orcamento-whatsapp-v2.yml
      - name: Commitar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-orcamento-whatsapp-v2.yml
          git commit -m "Corrige definitivamente envio do orçamento ao WhatsApp"
          git push
